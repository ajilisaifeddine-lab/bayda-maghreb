<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bayda Lab 2026</title>
    <link rel="stylesheet" href="style.css?v=601"> 
</head>
<body data-mode="beginner" data-theme="light">
    
    <div class="modal-overlay" id="consent-modal">
        <div class="modal-content">
            <h2>👋 أهلاً بك في Bayda Lab</h2>
            <p>هل تسمح لنا باكتشاف لهجتك تلقائياً لتقديم تجربة مخصصة لك؟</p>
            <div class="modal-actions">
                <button class="btn-primary" onclick="acceptConsent()">نعم، بالطبع</button>
                <button class="btn-secondary" onclick="declineConsent()">لا، سأختار بنفسي</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="settings-modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeSettings()">×</button>
            <h2>⚙️ الإعدادات</h2>
            <div class="setting-row">
                <label>حجم الخط:</label>
                <input type="range" id="font-size-slider" min="12" max="24" value="16" oninput="changeFontSize(this.value)">
            </div>
            <div class="setting-row">
                <label>المؤثرات الصوتية:</label>
                <button id="toggle-sound-setting" class="btn-secondary" onclick="toggleSoundFromSettings()">🔊 مفعل</button>
            </div>
            <div class="setting-row">
                <label>مسح البيانات:</label>
                <button class="btn-secondary" onclick="clearAllData()" style="color:#ef4444; border-color:#ef4444;">🗑️ مسح الكل</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="dict-popup">
        <div class="modal-content">
            <button class="close-btn" onclick="closeDictPopup()">×</button>
            <h4 id="dw-word" style="font-size: 1.5rem; color: var(--primary); margin-bottom: 10px;"></h4>
            <p id="dw-ar" style="font-size: 1.1rem; font-weight: bold;"></p>
        </div>
    </div>

    <header>
        <div class="hero-card">
            <div class="flags-side">
                <button class="flag-btn" data-dialect="tn-latn"><img src="https://flagcdn.com/w160/tn.png" class="flag-img" alt="TN"></button>
                <button class="flag-btn" data-dialect="dz-latn"><img src="https://flagcdn.com/w160/dz.png" class="flag-img" alt="DZ"></button>
                <button class="flag-btn" data-dialect="ly-latn"><img src="https://flagcdn.com/w160/ly.png" class="flag-img" alt="LY"></button>
            </div>
            <div class="logo-container">
                <img src="assets/logo.png" id="main-logo" class="logo-img" alt="Logo">
            </div>
            <div class="flags-side">
                <button class="flag-btn" data-dialect="mr-latn"><img src="https://flagcdn.com/w160/mr.png" class="flag-img" alt="MR"></button>
                <button class="flag-btn" data-dialect="kab-latn"><img src="assets/kabyle.png" class="flag-img" alt="Kabyle"></button>
                <button class="flag-btn" data-dialect="shi-latn"><img src="assets/amazigh.png" class="flag-img" alt="Shilha"></button>
            </div>
        </div>

        <div class="controls-card">
            <button class="icon-btn" id="side-toggle-btn" onclick="toggleDictionary()" title="إخفاء/إظهار">📖</button>
            <button class="icon-btn" onclick="toggleLayout()" title="تغيير التخطيط">🖥️</button>
            <button class="icon-btn" onclick="openSettings()" title="الإعدادات">⚙️</button>
            <div class="divider"></div>
            <select id="target-lang" class="custom-select">
                <option value="js">JS</option>
                <option value="py">PY</option>
            </select>
            <select id="mode-select" class="custom-select">
                <option value="kid">🧸 طفل</option>
                <option value="beginner" selected>🌱 مبتدئ</option>
                <option value="pro">👨‍💻 محترف</option>
            </select>
            
            <!-- زر السمة الموحد -->
            <div class="theme-controls" id="standard-theme-controls">
                <button class="icon-btn" id="theme-toggle-btn" onclick="cycleTheme()">☀️</button>
            </div>

            <!-- أزرار الطفل -->
            <div class="theme-controls hidden" id="kid-theme-controls">
                <button class="icon-btn" onclick="changeKidTheme()" title="تغيير الألوان">🎨</button>
                <button class="icon-btn" onclick="readOutput()" title="استمع للنتيجة">🗣️</button>
                <button class="icon-btn" onclick="magicCode()" title="كود سحري">🪄</button>
            </div>
        </div>
    </header>

    <main class="workspace layout-col" id="workspace">
        <div class="pane editor-pane" id="editor-pane">
            <div class="pane-header">
                <span>المحرر (Franco)</span>
                <button class="icon-btn" onclick="togglePane('editor-pane', this)">-</button>
            </div>
            <textarea id="editor" spellcheck="false"></textarea>
        </div>

        <div class="pane dict-pane" id="dict-pane">
            <div class="pane-header">
                <span>القاموس التفاعلي</span>
                <button class="icon-btn" onclick="togglePane('dict-pane', this)">-</button>
            </div>
            <div class="dict-content">
                <div class="dict-chips" id="dict-chips"></div>
            </div>
        </div>

        <div class="pane notes-pane hidden" id="notes-pane">
            <div class="pane-header notes-header">
                <span>الملاحظات</span>
                <button class="icon-btn" onclick="togglePane('notes-pane', this)">-</button>
            </div>
            <div class="notes-toolbar">
                <select id="note-selector" class="custom-select" onchange="loadSelectedNote()"></select>
                <button class="icon-btn" onclick="createNewNote()" title="ملاحظة جديدة">➕</button>
                <button class="icon-btn" onclick="deleteCurrentNote()" title="حذف">🗑️</button>
                <div class="divider"></div>
                <button class="icon-btn" onclick="formatDoc('bold')"><b>B</b></button>
                <button class="icon-btn" onclick="formatDoc('italic')"><i>I</i></button>
            </div>
            <div id="notes-editor" class="notes-editor" contenteditable="true" dir="ltr" placeholder="اكتب ملاحظاتك هنا..."></div>
        </div>

        <div class="pane output-pane" id="output-pane">
            <div class="pane-header">
                <span>النتيجة (Output)</span>
                <button class="icon-btn" onclick="togglePane('output-pane', this)">-</button>
            </div>
            <pre id="output">// النتيجة هنا...</pre>
        </div>
    </main>

    <footer class="footer-run">
        <button class="btn-run" id="run-btn">▶ تشغيل الكود</button>
    </footer>
    
    <script src="main.js?v=601"></script>
</body>
</html>
