<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bayda Lab - مختبر بايدا</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <span>🧪 Bayda Lab (نسخة المتصفح)</span>
    </header>
    <div style="padding: 0 1rem; display: flex; justify-content: flex-end; gap: 1rem; align-items: center;">
        <label>اللهجة:</label>
        <select id="dialect-select" class="target-select">
            <option value="tn-latn">التونسية</option>
            <option value="dz-latn">الجزائرية</option>
            <option value="ly-latn">الليبية</option>
            <option value="mr-latn">الموريتانية</option>
            <option value="kab-latn">القبائلية</option>
            <option value="shi-latn">الشلحية</option>
        </select>
        </select>
        <label>لغة الإخراج:</label>
        <select id="target-lang" class="target-select">
            <option value="js">JavaScript</option>
            <option value="py">Python</option>
        </select>
    </div>

    <div class="workspace">
        <div class="pane">
            <div class="pane-header">المحرر (اكتب كودك هنا)</div>
            <textarea id="editor">ktab("salam 3alikom")
idha (haqq) {
    ktab("Hello World")
}</textarea>
        </div>
        <div class="pane">
            <div class="pane-header">النتيجة (الكود المترجم)</div>
            <pre id="output">// اضغط على زر التشغيل...</pre>
        </div>
    </div>
    <button class="btn-run" id="run-btn">▶ تشغيل الكود (Run)</button>
    <script type="module" src="main.js"></script>
</body>
</html>
